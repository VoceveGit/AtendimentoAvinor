name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          curl -fsS --retry 2 --retry-delay 5 \
            "${HEALTH_URL:-https://avinor-atendimento.onrender.com/api/health}"
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
